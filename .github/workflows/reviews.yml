name: Pobierz opinie Google

on:
  schedule:
    # Kilka prób dziennie — GitHub bywa niepunktualny/pomija cron, więc dajemy
    # redundancję. Wystarczy, że jedna z nich się wykona. (3 zapytania/dobę = grosze.)
    - cron: "0 5 * * *"    # ~07:00 czasu PL
    - cron: "0 11 * * *"   # ~13:00 czasu PL
    - cron: "0 17 * * *"   # ~19:00 czasu PL
  workflow_dispatch: {}    # ręczne uruchomienie (przycisk "Run workflow")

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Pobierz opinie z Google
        env:
          GOOGLE_PLACES_KEY: ${{ secrets.GOOGLE_PLACES_KEY }}
        run: node fetch-reviews.js

      - name: Zapisz reviews.json (jeśli się zmienił)
        run: |
          if [ -n "$(git status --porcelain reviews.json)" ]; then
            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add reviews.json
            git commit -m "Aktualizacja opinii Google"
            git push
          else
            echo "Brak zmian w opiniach"
          fi
